name: EvoX A17 GSI (pioneiro)

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Só sincronizar (sem compilar)'
        required: false
        default: 'true'

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Limpeza agressiva de disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h / && free -h
          mkdir -p /tmp/probe && df -h / > /tmp/probe/df-cleanup.txt

      - name: Upload df pos-limpeza
        uses: actions/upload-artifact@v4
        with:
          name: df-cleanup
          path: /tmp/probe/df-cleanup.txt

      - name: Instalar repo + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev git-lfs 2>&1 | tail -n 2
          mkdir -p ~/bin ~/evo
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init (EvoX cnb + trio Doze-off)
        working-directory: /home/runner/evo
        run: |
          repo init -u https://github.com/EzequielDevTeam/EvoX_A17_treble -b main -m EvoX_A17.xml --depth=1 --git-lfs

      - name: Dividir sync em 4 partes
        working-directory: /home/runner/evo
        run: |
          repo list -n > /tmp/all-projects.txt
          wc -l /tmp/all-projects.txt
          split -n l/4 -d /tmp/all-projects.txt /tmp/chunk-
          wc -l /tmp/chunk-* ; wc -c /tmp/chunk-*

      - name: Sync parte 1/4
        working-directory: /home/runner/evo
        timeout-minutes: 100
        run: |
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 $(cat /tmp/chunk-00) 2>&1 | tail -n 3
          df -h / > /tmp/probe/df-1.txt; cat /tmp/probe/df-1.txt

      - name: Upload df parte 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-1
          path: /tmp/probe/df-1.txt

      - name: Sync parte 2/4
        working-directory: /home/runner/evo
        timeout-minutes: 100
        run: |
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 $(cat /tmp/chunk-01) 2>&1 | tail -n 3
          df -h / > /tmp/probe/df-2.txt; cat /tmp/probe/df-2.txt

      - name: Upload df parte 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-2
          path: /tmp/probe/df-2.txt

      - name: Sync parte 3/4
        working-directory: /home/runner/evo
        timeout-minutes: 100
        run: |
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 $(cat /tmp/chunk-02) 2>&1 | tail -n 3
          df -h / > /tmp/probe/df-3.txt; cat /tmp/probe/df-3.txt

      - name: Upload df parte 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-3
          path: /tmp/probe/df-3.txt

      - name: Sync parte 4/4
        working-directory: /home/runner/evo
        timeout-minutes: 100
        run: |
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 $(cat /tmp/chunk-03) 2>&1 | tail -n 3
          df -h / > /tmp/probe/df-4.txt; cat /tmp/probe/df-4.txt
          FREE_GB=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          echo "livre: ${FREE_GB}GB"
          if [ "$FREE_GB" -lt 15 ]; then echo "FALHA: disco insuficiente para build"; exit 1; fi

      - name: Upload df parte 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-4
          path: /tmp/probe/df-4.txt

      - name: Validar trio + lunch
        working-directory: /home/runner/evo
        run: |
          ls device/phh/treble/evox_gsi.mk vendor/hardware_overlay/overlay.mk treble_app/TrebleApp.apk
          source build/envsetup.sh
          lunch evox_gsi-userdebug
