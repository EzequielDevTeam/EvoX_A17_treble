name: EvoX A17 GSI (pioneiro)

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Só sincronizar (sem compilar)'
        required: false
        default: 'true'

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Limpeza agressiva de disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h / && free -h
          mkdir -p /tmp/probe && df -h / > /tmp/probe/df-cleanup.txt

      - name: Swap de emergencia (16G contra OOM, opcional)
        continue-on-error: true
        run: |
          ( sudo fallocate -l 16G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1G count=16 status=none ) || true
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "SEM SWAP (runner nao permite) - seguindo sem"
          free -h; df -h /

      - name: Upload df pos-limpeza
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-cleanup
          path: /tmp/probe/df-cleanup.txt

      - name: Instalar repo + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev git-lfs 2>&1 | tail -n 2
          mkdir -p ~/bin ~/evo
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init (EvoX cnb + trio Doze-off)
        working-directory: /home/runner/evo
        run: |
          repo init -u https://github.com/EzequielDevTeam/EvoX_A17_treble -b main -m EvoX_A17.xml --depth=1 --git-lfs

      - name: Probe rapido (trio Doze-off)
        working-directory: /home/runner/evo
        timeout-minutes: 10
        run: |
          repo sync -c --no-tags --no-clone-bundle -j4 device/phh/treble vendor/hardware_overlay treble_app 2>&1 | tail -n 3
          ls device/phh/treble/evox_gsi.mk vendor/hardware_overlay/overlay.mk treble_app/TrebleApp.apk
          free -h > /tmp/probe/probe-trio.txt; df -h / >> /tmp/probe/probe-trio.txt

      - name: Upload probe trio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-trio
          path: /tmp/probe/probe-trio.txt

      - name: Dividir sync em 8 partes
        working-directory: /home/runner/evo
        run: |
          repo list -n > /tmp/all-projects.txt
          wc -l /tmp/all-projects.txt
          split -n l/8 -d /tmp/all-projects.txt /tmp/chunk-
          wc -l /tmp/chunk-*

      - name: Sync parte 1/8
        working-directory: /home/runner/evo
        timeout-minutes: 100
        run: |
          ( while true; do echo "=== $(date -u +%H:%M:%S) ==="; df -h / | tail -n 2; du -sh .repo 2>/dev/null || true; sleep 60; done > /tmp/probe/beat-1.log 2>&1 & echo $! > /tmp/probe/beat-1.pid )
          df -h / > /tmp/probe/df-1.txt
          ok=0
          for t in 1 2 3; do
            echo "=== parte 1 tentativa $t ==="
            repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 $(cat /tmp/chunk-00) > /tmp/probe/sync-1.log 2>&1 && { ok=1; break; }
            echo "tentativa $t falhou:"
            grep -a -iE "error|fatal|fail" /tmp/probe/sync-1.log | tail -n 8 || true
            df -h / >> /tmp/probe/df-1.txt
            sleep 20
          done
          kill $(cat /tmp/probe/beat-1.pid) 2>/dev/null || true
          echo "sync_ok=$ok"
          df -h / >> /tmp/probe/df-1.txt; cat /tmp/probe/df-1.txt
          [ "$ok" = "1" ]

      - name: Upload rastro parte 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-1
          path: |
            /tmp/probe/df-1.txt
            /tmp/probe/sync-1.log
            /tmp/probe/beat-1.log

      - name: Sync parte 2/8
        working-directory: /home/runner/evo
        timeout-minutes: 100
