name: EvoX A17 GSI (pioneiro)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Limpeza de disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Instalar repo + deps + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev git-lfs ccache 2>&1 | tail -n 2
          mkdir -p ~/bin ~/evo
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV

      - name: Repo init (EvoX cnb + trio Doze-off)
        working-directory: /home/runner/evo
        run: |
          repo init -u https://github.com/EzequielDevTeam/EvoX_A17_treble -b main -m EvoX_A17.xml --depth=1 --git-lfs

      - name: Baixar manifest direto do GitHub (sem vendor_gms)
        working-directory: /home/runner/evo
        run: |
          curl -sL https://raw.githubusercontent.com/EzequielDevTeam/EvoX_A17_treble/main/EvoX_A17.xml -o .repo/manifest.xml
          grep -c vendor_gms .repo/manifest.xml && echo "AVISO: vendor_gms ainda presente" || echo "OK: vendor_gms ausente"

      - name: Dividir sync em grupos
        working-directory: /home/runner/evo
        run: |
          repo list -n > /tmp/all-projects.txt
          wc -l /tmp/all-projects.txt
          split -n l/6 -d /tmp/all-projects.txt /tmp/chunk-
          wc -l /tmp/chunk-*

      - name: Sync grupos 1-6 com retry
        working-directory: /home/runner/evo
        timeout-minutes: 100
        run: |
          for chunk in /tmp/chunk-00 /tmp/chunk-01 /tmp/chunk-02 /tmp/chunk-03 /tmp/chunk-04 /tmp/chunk-05; do
            echo "=== Sincronizando $chunk ==="
            ok=0
            for t in 1 2 3; do
              echo "--- tentativa $t ---"
              repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 $(cat $chunk) >> /tmp/probe/sync-$chunk.log 2>&1 && { ok=1; break; }
              echo "tentativa $t falhou:"
              grep -a -iE "error|fatal|fail" /tmp/probe/sync-$chunk.log | tail -n 5 || true
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "FALHA no chunk $chunk"
              cat /tmp/probe/sync-$chunk.log | tail -n 20
              exit 1
            fi
            echo "$chunk OK"
            df -h / | tail -n 2
          done

      - name: Garantir vendor/lineage/build/envsetup.sh existe
        working-directory: /home/runner/evo
        run: |
          mkdir -p vendor/lineage/build
          if [ ! -f vendor/lineage/build/envsetup.sh ]; then
            echo '# stub envsetup (criado pelo workflow)' > vendor/lineage/build/envsetup.sh
          fi
          ls -la vendor/lineage/build/envsetup.sh
          cat vendor/lineage/build/envsetup.sh

      - name: Vigia disco final
        working-directory: /home/runner/evo
        run: |
          df -h /
          FREE=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          echo "livre: ${FREE}GB"
          if [ "$FREE" -lt 15 ]; then echo "FALHA: disco insuficiente"; exit 1; fi

      - name: lunch evox_gsi-userdebug
        working-directory: /home/runner/evo
        run: |
          ls device/phh/treble/evox_gsi.mk vendor/hardware_overlay/overlay.mk treble_app/TrebleApp.apk
          source build/envsetup.sh
          lunch evox_gsi-userdebug
