name: EvoX A17 GSI (pioneiro)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Limpeza de disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Instalar repo + deps + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev git-lfs ccache 2>&1 | tail -n 2
          mkdir -p ~/bin ~/evo
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV

      - name: Repo init (EvoX cnb + trio Doze-off)
        working-directory: /home/runner/evo
        run: |
          repo init -u https://github.com/EzequielDevTeam/EvoX_A17_treble -b main -m EvoX_A17.xml --depth=1 --git-lfs

      - name: Baixar manifest direto do GitHub (sem vendor_gms)
        working-directory: /home/runner/evo
        run: |
          curl -sL https://raw.githubusercontent.com/EzequielDevTeam/EvoX_A17_treble/main/EvoX_A17.xml -o .repo/manifest.xml
          grep -c vendor_gms .repo/manifest.xml && echo "AVISO: vendor_gms ainda presente" || echo "OK: vendor_gms ausente"

      - name: Sync completo (pode demorar ~30min)
        working-directory: /home/runner/evo
        timeout-minutes: 330
        run: |
          repo sync -c --no-tags --no-clone-bundle -j2 2>&1 | tee /tmp/probe/sync.log | tail -n 30

      - name: Garantir vendor/lineage/build/envsetup.sh existe
        working-directory: /home/runner/evo
        run: |
          mkdir -p vendor/lineage/build
          echo '# stub envsetup (vendor/lineage pode nao ter build/envsetup.sh)' > vendor/lineage/build/envsetup.sh
          ls -la vendor/lineage/build/envsetup.sh

      - name: Vigia disco final
        working-directory: /home/runner/evo
        run: |
          df -h /
          FREE=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          echo "livre: ${FREE}GB"
          if [ "$FREE" -lt 15 ]; then echo "FALHA: disco insuficiente"; exit 1; fi

      - name: lunch evox_gsi-userdebug
        working-directory: /home/runner/evo
        run: |
          ls device/phh/treble/evox_gsi.mk vendor/hardware_overlay/overlay.mk treble_app/TrebleApp.apk
          source build/envsetup.sh 2>&1 | tee /tmp/probe/envsetup.log
          lunch evox_gsi-userdebug 2>&1 | tee /tmp/probe/lunch.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunch-logs
          path: |
            /tmp/probe/envsetup.log
            /tmp/probe/lunch.log
            /tmp/probe/sync.log
