          ( while true; do echo "=== $(date -u +%H:%M:%S) ==="; df -h / | tail -n 2; du -sh .repo 2>/dev/null || true; sleep 60; done > /tmp/probe/beat-2.log 2>&1 & echo $! > /tmp/probe/beat-2.pid )
