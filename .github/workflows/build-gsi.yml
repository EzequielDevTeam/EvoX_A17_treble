name: EvoX A17 GSI (pioneiro)

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Só sincronizar (sem compilar)'
        required: false
        default: 'true'

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Limpeza agressiva de disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h / && free -h
          mkdir -p /tmp/probe && df -h / > /tmp/probe/df-cleanup.txt

      - name: Upload df pos-limpeza
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-cleanup
          path: /tmp/probe/df-cleanup.txt

      - name: Swap de emergencia (opcional)
        continue-on-error: true
        run: |
          ( sudo fallocate -l 16G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1G count=16 status=none ) || true
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "SEM SWAP - seguindo sem"
          free -h; df -h /

      - name: Instalar repo + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev git-lfs 2>&1 | tail -n 2
          mkdir -p ~/bin ~/evo
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init (EvoX cnb + trio Doze-off)
        working-directory: /home/runner/evo
        run: |
          repo init -u https://github.com/EzequielDevTeam/EvoX_A17_treble -b main -m EvoX_A17.xml --depth=1 --git-lfs

      - name: Sync [treble_app] (1 projetos)
        working-directory: /home/runner/evo
        timeout-minutes: 60
        run: |
          echo "=== grupo treble_app ===" > /tmp/probe/g-01.log
          df -h / >> /tmp/probe/g-01.log; free -h >> /tmp/probe/g-01.log
          ok=0
          for t in 1 2; do
            echo "== tentativa $t ==" | tee -a /tmp/probe/g-01.log
            repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4 treble_app >> /tmp/probe/g-01.log 2>&1 && { ok=1; break; }
            grep -a -iE "error|fatal|fail" /tmp/probe/g-01.log | tail -n 5 || true
            sleep 15
          done
          echo "sync_ok=$ok" | tee -a /tmp/probe/g-01.log
          df -h / >> /tmp/probe/g-01.log; free -h >> /tmp/probe/g-01.log; du -sh .repo >> /tmp/probe/g-01.log || true
          cat /tmp/probe/g-01.log | tail -n 6
          [ "$ok" = "1" ]

      - name: Upload grupo treble_app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-01-treble_app
          path: /tmp/probe/g-01.log

      - name: Sync [device] (22 projetos)
