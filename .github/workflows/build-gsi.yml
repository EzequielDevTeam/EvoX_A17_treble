name: EvoX A17 GSI (diagnostico)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs 2>&1 | tail -n 2
          mkdir -p ~/bin ~/evo
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init
        working-directory: /home/runner/evo
        run: |
          repo init -u https://github.com/EzequielDevTeam/EvoX_A17_treble -b main -m EvoX_A17.xml --depth=1 --git-lfs

      - name: Baixar manifest
        working-directory: /home/runner/evo
        run: |
          curl -sL https://raw.githubusercontent.com/EzequielDevTeam/EvoX_A17_treble/main/EvoX_A17.xml -o .repo/manifest.xml

      - name: Repo list count
        working-directory: /home/runner/evo
        run: |
          repo list -n | wc -l
          repo list -n | head -n 20

      - name: Sync tudo simples
        working-directory: /home/runner/evo
        timeout-minutes: 60
        run: |
          repo sync -c --no-tags --no-clone-bundle -j2 2>&1 | tail -n 30
